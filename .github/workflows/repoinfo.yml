name: Repo Info

on:
  workflow_dispatch:

jobs:
  repo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Commands
        run: |
          touch commits.txt
          git log --oneline > commits.txt

      - name: Print info
        run: cat commits.txt
      - name: Tag print
        run: |
          git tag
          git checkout 1.0
          cat README.md
        
