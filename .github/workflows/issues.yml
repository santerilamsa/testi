name: Issue workflow

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  issue-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print issue information
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ASSIGNEE_NAME: ${{ github.event.issue.assignee.login }}
        run: |
          echo "Issue title: $ISSUE_TITLE"
          echo "Assignee: $ASSIGNEE_NAME"

      - name: Add issue to README
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ASSIGNEE_NAME: ${{ github.event.issue.assignee.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          echo "- [$ISSUE_TITLE]($ISSUE_URL) - Assignee: $ASSIGNEE_NAME" >> README.md

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Add issue to README" || exit 0
          git push

      - name: Print issue comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          echo "Comment: $COMMENT"
          echo "Comment author: $COMMENT_AUTHOR"
