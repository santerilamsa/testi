name: Issue workflow

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  issue-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print issue information
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ASSIGNEE_NAME: ${{ github.event.issue.assignee.login }}
        run: |
          echo "Issue title: $ISSUE_TITLE"
          echo "Assignee: $ASSIGNEE_NAME"

      - name: Add issue to README
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ASSIGNEE_NAME: ${{ github.event.issue.assignee.login }}
        run: |
          echo "Issue: $ISSUE_TITLE, Assignee: $ASSIGNEE_NAME" >> README.md
